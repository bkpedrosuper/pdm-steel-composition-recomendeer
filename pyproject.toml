[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdm-remake"
version = "0.1.0"
description = "Surrogate de propriedades mecânicas do aço + otimizador multiobjetivo, com deploy na AWS"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pdm*"]

[tool.setuptools.package-data]
pdm = ["config.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
