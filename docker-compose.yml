# Ambiente local que imita a AWS: Postgres (= RDS), MLflow (= EC2) e API.
# Pré-requisito: python -m pdm.train (gera artifacts/model)
# Subir:     docker compose up -d --build
# Registrar: docker compose run --rm api python -m pdm.register /app/artifacts/model
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pdm
      POSTGRES_PASSWORD: pdm
      POSTGRES_DB: pdm
    volumes:
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]

  mlflow:
    build: { context: ., dockerfile: Dockerfile.mlflow }
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://pdm:pdm@postgres:5432/mlflow
      --artifacts-destination /mlartifacts --serve-artifacts
    volumes: [mlartifacts:/mlartifacts]
    ports: ["5000:5000"]
    depends_on: [postgres]

  api:
    build: .
    environment:
      PDM_MODEL_URI: /app/artifacts/model
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATABASE_URL: postgresql+psycopg2://pdm:pdm@postgres:5432/pdm
    volumes: [./artifacts:/app/artifacts]
    ports: ["8000:8000"]
    depends_on: [mlflow]

volumes:
  pgdata:
  mlartifacts:
